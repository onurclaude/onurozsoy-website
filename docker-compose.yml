services:
  site:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5500:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./favicon.png:/usr/share/nginx/html/favicon.png:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app-ads.txt:/usr/share/nginx/html/app-ads.txt:ro
      - ./nicolateslaflyingcar:/usr/share/nginx/html/nicolateslaflyingcar:ro
    depends_on:
      - console

  console:
    build: ./console
    restart: unless-stopped
    expose:
      - "4173"
    env_file:
      - ./console/.env
    environment:
      - IMAGES_DIR=/data/images
      - INDEX_HTML=/data/index.html
    volumes:
      - ./images:/data/images
      - ./index.html:/data/index.html
      # Ziyaretçi istatistikleri (sunucuda /opt/visit-stats üretir; yoksa sayfa "veri yok" der)
      - /var/lib/visit-stats/public:/data/visits:ro
