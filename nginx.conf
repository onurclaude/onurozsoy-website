server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location /console/ {
        proxy_pass http://console:4173/console/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # public contact form submission (the only unauthenticated console endpoint)
    location = /contact {
        client_max_body_size 32k;
        proxy_pass http://console:4173/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        proxy_pass http://console:4173/api/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
