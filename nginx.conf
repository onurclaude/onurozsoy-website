server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript;
    # Proxy arkasında (host nginx → :5500) yönlendirmeler göreli kalsın; http:// veya :80 sızmasın.
    absolute_redirect off;

    location / {
        # /nicolateslaflyingcar gibi uzantısız adresler yönlendirmesiz dizin index'ini sunar
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Ortak reklam doğrulama dosyası (tüm uygulamalar için)
    location = /app-ads.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location /console/ {
        proxy_pass http://console:4173/console/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://console:4173/api/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
