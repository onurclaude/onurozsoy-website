server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript;
    # Proxy arkasında (host nginx → :5500) yönlendirmeler göreli kalsın; http:// veya :80 sızmasın.
    absolute_redirect off;

    location / {
        # /nicolateslaflyingcar gibi uzantısız adresler yönlendirmesiz dizin index'ini sunar
        try_files $uri $uri/index.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Ortak reklam doğrulama dosyası (tüm uygulamalar için)
    location = /app-ads.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location /console/ {
        proxy_pass http://console:4173/console/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # public contact form submission (the only unauthenticated console endpoint)
    location = /contact {
        client_max_body_size 32k;
        proxy_pass http://console:4173/contact;
        proxy_set_header Host $host;
        # Ziyaretçinin gerçek IP'si host nginx'ten X-Real-IP ile gelir ($remote_addr burada Docker gateway'idir).
        # Güvenli olması 5500'ün yalnızca 127.0.0.1'e bağlı olmasına dayanır (docker-compose.yml).
        proxy_set_header X-Forwarded-For $http_x_real_ip;
    }

    location /api/ {
        proxy_pass http://console:4173/api/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
